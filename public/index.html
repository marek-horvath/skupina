<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Software Engineering and Usability Group at KPI FEI TUKE: people, publications, teaching subjects, and events focused on software engineering and usability.">
    <meta name="robots" content="index,follow">
    <meta property="og:title" content="Software Engineering and Usability Group">
    <meta property="og:description" content="Software Engineering and Usability Group at KPI FEI TUKE: people, publications, teaching subjects, and events focused on software engineering and usability.">
    <meta property="og:site_name" content="Software Engineering and Usability Group">
    <meta property="og:locale" content="en_GB">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://marek-horvath.github.io/skupina/">
    <link rel="canonical" href="https://marek-horvath.github.io/skupina/">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>SEUG</title>
      <script>
      (function() {
        var search = window.location.search;
        if (!search || search.indexOf('?/') !== 0) {
          return;
        }
        var decoded = search
          .slice(2)
          .split('&')
          .map(function(s) { return s.replace(/~and~/g, '&'); })
          .join('?');

        var baseUrl = '<%= BASE_URL %>';
        var keepSegments = baseUrl.split('/').filter(Boolean).length;
        var pathParts = window.location.pathname.split('/');
        var basePath = pathParts.slice(0, keepSegments + 1).join('/');

        window.history.replaceState(null, '', basePath + '/' + decoded + window.location.hash);
      })();
    </script>
</head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  </body>
</html>
