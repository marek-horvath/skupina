<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search ? window.location.search.slice(1) : '';
        var hash = window.location.hash || '';

        var basePath = '/skupina/';
        var redirectPath = path.slice(basePath.length).replace(/&/g, '~and~');
        var redirectSearch = search ? '&' + search.replace(/&/g, '~and~') : '';

        window.location.replace(basePath + '?/' + redirectPath + redirectSearch + hash);
      })();
    </script>
  </head>
  <body></body>
</html>
