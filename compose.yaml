name: seug

x-seug-app: &seug-app
  image: seug-local:dev
  init: true
  restart: unless-stopped
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  api:
    <<: *seug-app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "--watch", "server/publications-api.js"]
    environment:
      NODE_ENV: development
      PUBLICATIONS_API_HOST: 0.0.0.0
      PUBLICATIONS_API_PORT: 5174
      SEUG_DATA_DIR: /app/data
      SEUG_PUBLIC_DATA_DIR: /app/public/data
      SEUG_SEED_DATA: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    ports:
      - "${API_PORT:-5174}:5174"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_data:/app/data
      - public_data:/app/public/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5174/api/people').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    <<: *seug-app
    command: ["npm", "run", "serve", "--", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      NODE_ENV: development
      PUBLICATIONS_API_PROXY: http://api:5174
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-8090}:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - public_data:/app/public/data:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  node_modules:
  app_data:
  public_data:
